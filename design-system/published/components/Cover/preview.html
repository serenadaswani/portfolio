<!-- @dsCard height=288 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Paper × Midnight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wdth,wght@75..100,400..700&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--color-bg-canvas); color:var(--color-text-primary); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; width:960px; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; }
  .art svg { display:block; width:480px; height:288px; }
  .deep { fill:var(--color-text-primary); }
  .brand { fill:var(--cobalt-500); }
  .tint { fill:var(--cobalt-100); }
  .blk { rx:var(--radius-md); }
  .rule { stroke:var(--color-border-default); stroke-width:1; }
  .words { position:absolute; left:var(--space-6); bottom:var(--space-6); max-width:440px; }
  .name { margin:0; font-size:88px; line-height:.95; font-weight:500; letter-spacing:var(--tracking-display); font-stretch:var(--font-width-display); color:var(--color-text-primary); }
  .tag { margin:var(--space-3) 0 0 2px; font-size:14px; line-height:20px; color:var(--color-text-secondary); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      color-text-primary slab 240×264 bleeding off top and right (ink on paper; inverts to paper on midnight — the name made literal) · cobalt-500 128×168, the one accent · cobalt-100 56×96 for relief — ≈30% of 960×288
  arrangement one tall slab with two satellites, bottoms on one line space-6 above the edge, space-4 gutters
  pattern     four hairline rules, from "editorial, borders not shadows": a baseline grid in color-border-default crossing the blocks at a space-16 pitch
  scales      sides in space-2 multiples; gutters space-4; rule pitch space-16; corners radius-md
-->
<rect class="tint blk" x="24" y="168" width="56" height="96" rx="8"/>
<rect class="brand blk" x="96" y="96" width="128" height="168" rx="8"/>
<rect class="deep blk" x="240" y="-12" width="252" height="276" rx="8"/>
<line class="rule" x1="0" y1="56.5" x2="480" y2="56.5"/>
<line class="rule" x1="0" y1="120.5" x2="480" y2="120.5"/>
<line class="rule" x1="0" y1="184.5" x2="480" y2="184.5"/>
<line class="rule" x1="0" y1="248.5" x2="480" y2="248.5"/>
</svg>
</div>
<div class="words">
<p class="name">Paper ×<br>Midnight</p>
<p class="tag">Editorial foundations for a product design portfolio.</p>
</div>
</div>
</body>
</html>
