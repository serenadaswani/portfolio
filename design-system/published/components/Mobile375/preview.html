<article class="cs" aria-labelledby="cs-{{T}}"><aside class="pm-panel pm-panel--sm pm-panel--tonal" aria-label="Project details"><div class="pm-panel__body" style="padding-top:var(--panel-p)"><dl class="pm-meta"><dt>Role</dt><dd>Lead product designer</dd><dt>Team</dt><dd>2 designers, 6 engineers, 1 PM</dd><dt>Timeline</dt><dd><span class="pm-meta-text">2024.02 – 2024.11</span></dd><dt>Outcome</dt><dd>Median triage time roughly halved in the pilot</dd></dl></div></aside><div class="prose"><p class="pm-meta-text" style="margin:0 0 var(--space-2)">02 — The problem</p><h2 id="cs-{{T}}" class="h2">The problem</h2><p class="body-lg lede">Reviewers spent most of their time deciding what to look at, not reviewing it.</p><p class="body-md">Evaluation results landed in a flat list sorted by time. Experienced reviewers built private spreadsheets to triage; new reviewers couldn’t. I mapped where the queue lost its signal and found that <a class="pm-link" href="#cs">three missing fields</a> drove most re-work.</p><hr class="pm-divider pm-divider--default pm-divider--sm"><p class="body-md" style="color:var(--color-text-primary)">Decision: rank by risk and explain the rank inline. The trade-off was opacity versus speed, and we chose an explanation reviewers could argue with.</p><hr class="pm-divider pm-divider--default pm-divider--sm"><h3 class="h3">What we tried first</h3><p class="body-md">An automatic “priority” score tested well on speed and badly on trust. Reviewers overrode it without reading it.</p><figure class="pm-frame"><div class="pm-frame__stage"><div class="pm-media pm-media--16x10"><img src="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%201600%201000%22%3E%3Crect%20width%3D%221600%22%20height%3D%221000%22%20fill%3D%22%23F6F7F9%22/%3E%3Crect%20x%3D%220%22%20y%3D%220%22%20width%3D%22360%22%20height%3D%221000%22%20fill%3D%22%23FFFFFF%22/%3E%3Crect%20x%3D%2240%22%20y%3D%2260%22%20width%3D%22200%22%20height%3D%2216%22%20rx%3D% <script>
(function(){
  function rgb(el, v){ var s=document.createElement('span'); s.style.color='var('+v+')'; el.appendChild(s); var c=getComputedStyle(s).color; s.remove(); var m=(c.match(/[\d.]+/g)||[0,0,0]).map(Number); var a=m.length>3?m[3]:1; return m.slice(0,3).map(function(x){return a*x+(1-a)*255;}); }
  function lum(c){ c=c.map(function(x){x/=255; return x<=0.04045?x/12.92:Math.pow((x+0.055)/1.055,2.4);}); return 0.2126*c[0]+0.7152*c[1]+0.0722*c[2]; }
  function ratio(a,b){ var x=lum(a), y=lum(b); return (Math.max(x,y)+0.05)/(Math.min(x,y)+0.05); }
  window.pmCheck=function(){ document.querySelectorAll('[data-fg]').forEach(function(el){
    var r=ratio(rgb(el, el.dataset.fg), rgb(el, el.dataset.bg)), min=parseFloat(el.dataset.min||'4.5');
    var deco=el.hasAttribute('data-deco');
    el.textContent=r.toFixed(2)+':1'+(deco?' · decorative':'');
    el.className=deco?'pm-ratio':(r>=min?'pm-ratio pm-pass':'pm-fail');
    el.setAttribute('title', el.dataset.fg+' on '+el.dataset.bg+' (needs '+min+':1)');
  }); };
  pmCheck();
  if (document.fonts) document.fonts.ready.then(function(){ window.pmAfterFonts && pmAfterFonts(); });
  new MutationObserver(function(){ pmCheck(); }).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme','style','class']});
})();

var t=document.getElementById('tpl').innerHTML;
document.getElementById('root').innerHTML=
  '<div class="page" data-theme="light">'+t.replace(/\{\{THEME\}\}/g,'Light · Paper').replace(/\{\{T\}\}/g,'l')+'</div>'+
  '<div class="page" data-theme="dark">'+t.replace(/\{\{THEME\}\}/g,'Dark · Midnight').replace(/\{\{T\}\}/g,'d')+'</div>';
document.querySelectorAll('a[href^="#"]').forEach(function(a){a.addEventListener('click',function(e){e.preventDefault();});});
document.querySelectorAll('.pm-topnav__menu').forEach(function(b){b.addEventListener('click',function(){var hd=b.closest('.pm-topnav'),o=b.getAttribute('aria-expanded')!=='true';b.setAttribute('aria-expanded',o);hd.setAttribute('data-open',o);});});
function specs(){
  var w=window.innerWidth, bp=w>=1024?'desktop':w>=768?'tablet':'mobile';
  document.querySelectorAll('.vp').forEach(function(e){e.textContent='Viewport '+w+'px · '+bp;});
  document.querySelectorAll('[data-s]').forEach(function(e){var p=e.nextElementSibling, cs=getComputedStyle(p); e.textContent=e.dataset.s+' · '+parseFloat(cs.fontSize)+'/'+Math.round(parseFloat(cs.lineHeight))+' · '+cs.fontWeight+(cs.fontStretch&&cs.fontStretch!=='100%'&&cs.fontStretch!=='normal'?' · '+cs.fontStretch:'');});
}
window.pmAfterFonts=specs; specs(); window.addEventListener('resize',specs); pmCheck();
